[project]
name = "fastapi-clean-architecture-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "psycopg[binary]>=3.2.12",
    "sqlalchemy>=2.0.44",
    "alembic>=1.18.4",
    "uvicorn>=0.38.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app/src"]
force-exclude = true
exclude = [
    ".venv",
    "build",
    "dist",
    "__pypackages__",
    "__pycache__",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    # "__init__.py",  # it will be excluded via per-file-ignores
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    # "S",   # flake8-bandit
    # "T20", # flake8-print
    # "PT",  # flake8-pytest-style
    # "ANN", # missing type annotations
    # "ARG", # argument type issues
]

# Ignore specific rules
ignore = [
    # "E501", # line too long
    # "B008", # do not perform function calls in argument defaults
]

# Allow fixing specific rules
fixable = ["ALL"]
unfixable = []

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy", "pep257"

# Common pragmatic exceptions in bootstrap:
[tool.ruff.lint.per-file-ignores]
"app/src/**/__init__.py" = ["D104"] # package without docstring
"tests/**" = ["D"]                  # tests are usually more "verbose" and less documented

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "types-requests>=2.32.4.20260107",
]

[tool.mypy]
files = ["app/src"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running PostgreSQL database",
]
